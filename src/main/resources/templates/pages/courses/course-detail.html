<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:with="http://www.thymeleaf.org/extras/with"
      layout:decorate="~{layout/page-layout}"
      with:title="강의상세">

<th:block layout:fragment="page-content">
    <div class="widget-body">
        <section id="widget-grid" class="">
            <div class="row">
                <article class="col-sm-12 col-md-12 col-lg-12 sortable-grid ui-sortable">
                    <div class="jarviswidget" id="" data-widget-editbutton="false" data-widget-deletebutton="false">
                        <!-- widget div-->
                        <div style="border-top:1px solid #ccc">
                            <!-- widget content -->
                            <div class="widget-body">
                                <div id="courseFrom" class="form-horizontal">
                                    <input type="hidden" id="courseSeq" name="courseSeq" th:value="${courseDetail.courseSeq}"/>
                                    <div class="form-group">
                                        <div class="col-md-12">
                                            <h6>■ 강의기본정보</h6>
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label class="control-label col-md-1"><strong>강의명</strong></label>
                                        <div class="col-md-6">
                                            <input class="form-control" placeholder="" type="text" maxlength="100"
                                                   id="title" name="title" th:value="${courseDetail.title}">
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label class="control-label col-md-1"><strong>카테고리</strong></label>
                                        <div class="col-md-3">
                                            <select class="form-control" id="categoryId" name="categoryId">
                                                <option th:each="item : ${categories}"
                                                        th:value="${item.categoryId}"
                                                        th:text="${item.categoryName}"
                                                        th:selected="${item.categoryId} == ${#strings.toString(courseDetail.categoryId)}"/>
                                            </select>
                                        </div>

                                        <label class="control-label col-md-1"><strong>수강비</strong></label>
                                        <div class="col-md-3">
                                            <input type="number" class="form-control" name="price" id="price"
                                                   th:value="${courseDetail.price}">
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label class="control-label col-md-1"><strong>태그</strong></label>
                                        <div class="col-md-3">
                                            <select multiple style="width:100%" class="select2" id="badge" name="badge">
                                                <option th:each="item : ${tags}" th:value="${item.code}"
                                                        th:text="${item.codeName}"
                                                        th:selected="${#strings.contains(courseDetail.badge, item.codeName)}"/>
                                            </select>
                                        </div>
                                        <label class="control-label col-md-1"><strong>온/오프 구분</strong></label>
                                        <div class="col-md-3">
                                            <select multiple style="width:100%" class="select2" id="badge" name="badge">
                                                <option th:each="item : ${onofftype}" th:value="${item.code}"
                                                        th:text="${item.codeName}"
                                                        th:selected="${#strings.contains(courseDetail.badge, item.codeName)}"/>
                                            </select>
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label class="control-label col-md-1"><strong>메인이미지</strong></label>
                                        <div class="col-md-7">
                                            <input type="file" class="btn btn-default" id="fileMainImg"/>
                                            <input type="hidden" id="mainImg" name="mainImg"/>
                                            <img  id="viewMinImg" th:src="${courseDetail.mainImg}" th:class="margin-top-5"  th:style="|height: 100px; ${#strings.isEmpty(courseDetail.mainImg) ? ' display: none' : 'display:block'}|"  />
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label class="control-label col-md-1"><strong>소개</strong></label>
                                        <div class="col-md-7">
                                            <textarea id="introd" name="introd" class="form-control"
                                                      placeholder="" rows="3">
  [[${#strings.toString(courseDetail.introd)}]]
														</textarea>
                                        </div>
                                    </div>
                                    <hr>
                                    <div class="form-group">
                                        <div class="col-md-12">
                                            <h6>■ 교육과정</h6>
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label class="control-label col-md-1"><strong>영상등록</strong></label>
                                        <form id="courseFile" method="POST" enctype="multipart/form-data">
                                            <input type="hidden" id="groupKey" name="groupKey"/>
                                            <div class="col-md-7">
                                                <!-- The fileupload-buttonbar contains buttons to add/delete files and start/cancel the upload -->
                                                <div class="row fileupload-buttonbar margin-bottom-5">
                                                    <div class="col-lg-4">
                                                        <!-- The fileinput-button span is used to style the file input field as button -->
                                                        <span class="btn btn-success fileinput-button">
                                                          <i class="glyphicon glyphicon-plus"></i>
                                                          <span>Add files...</span>
                                                          <input type="file" name="files[]" multiple/>
                                                        </span>
                                                        <button type="submit" id="allUpload"
                                                                class="btn btn-primary start">
                                                            <i class="glyphicon glyphicon-upload"></i>
                                                            <span>Start upload</span>
                                                        </button>

                                                    </div>
                                                    <div class="col-lg-4 fileupload-progress fade">
                                                        <!-- The global progress bar -->
                                                        <div class="progress progress-striped active" role="progressbar"
                                                             aria-valuemin="0" aria-valuemax="100">
                                                            <div class="progress-bar progress-bar-success"
                                                                 style="width: 0%;"></div>
                                                        </div>
                                                        <!-- The extended global progress state -->
                                                        <div class="progress-extended">&nbsp;</div>
                                                    </div>
                                                </div>
                                                <!-- The table listing the files available for upload/download -->
                                                <div class="table-responsive">
                                                    <table role="presentation"
                                                           class="table table-bordered text-align-center">
                                                        <thead>
                                                        <tr>
                                                            <th class="text-center col-md-1" scope="col">순번</th>
                                                            <th class="text-center col-md-3" scope="col">미리보기</th>
                                                            <th class="text-center col-md-4" scope="col">강의명</th>
                                                            <th class="text-center col-md-2" scope="col">크기</th>
                                                            <th class="text-center col-md-2" scope="col">무료 여부</th>
                                                            <th class="text-center col-md-2" scope="col">취소/삭제</th>
                                                        </tr>
                                                        </thead>
                                                        <tbody class="files">
                                                        <th:block>
                                                            <tr class="template-download fadeIn"
                                                                th:each="item, inputSeq : ${courseDetail.courseDetail}">
                                                                <td><input class="form-control" type="text" id="sort"
                                                                           th:name="|courseDetail[${inputSeq.index}].sort|"
                                                                           th:value="${item.sort}"/></td>
                                                                <td>  <video th:src="${item.fileUrl}" controls="controls" style="height: 150px;" /> ></td>
                                                                <td><input multiple class="form-control" type="text"
                                                                           id="unitTitle"
                                                                           th:name="|courseDetail[${inputSeq.index}].unitTitle|"
                                                                           th:value="${item.unitTitle}"/></td>
                                                                <td><span class="size"
                                                                          th:text="${item.fileSize}"></span></td>
                                                                <td><input  type="checkbox" id="freeYn" th:name="|courseDetail[${inputSeq.index}].freeYn|"   /></td>
                                                                <td>
                                                                    <input  type="hidden"  id="fileSeq"  th:name="|courseDetail[${inputSeq.index}].fileSeq|"  th:value="${item.fileSeq}" />
                                                                    <input  type="hidden"  id="courseDtlSeq" th:name="|courseDetail[${inputSeq.index}].courseDtlSeq|"  th:value="${item.courseDtlSeq}" />
                                                                    <button class="btn btn-danger delete" ><i
                                                                            class="glyphicon glyphicon-trash"></i><span>Delete</span>
                                                                    </button>
                                                                </td>
                                                            </tr>
                                                        </th:block>
                                                        </tbody>
                                                    </table>
                                                </div>
                                            </div>
                                        </form>
                                    </div>
                                    <hr>
                                    <div class="form-group">
                                        <div class="col-md-12">
                                            <h6>■ 상세내용</h6>
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label class="control-label col-md-1"><strong>내용</strong></label>
                                        <div class="col-md-7">
                                           	<textarea id="contentDetail" name="contentDetail">
                                               [[${#strings.toString(courseDetail.contentDetail)}]]
				                			</textarea>
                                        </div>
                                    </div>
                                    <hr>
                                    <div class="form-group">
                                        <div class="form-group text-center">

                                            <a class="btn btn-primary" href="javascript:void(0);"
                                               style="min-width:70px;" id="btnSave">저장</a>

                                            <a class="btn btn-default" href="javascript:void(0);"
                                               style="min-width:70px;" id="reset">초기화</a>
                                        </div>
                                    </div>

                                </div>
                            </div>
                            <!-- end widget content -->
                        </div>
                        <!-- end widget div -->
                    </div>
                </article>
            </div>
        </section>
    </div>
</th:block>
<th:block layout:fragment="custom-script">
    <!-- JQUERY SELECT2 INPUT -->
    <script th:src="@{/js/plugin/select2/select2.min.js}"></script>
    <!-- bootstrapValidator -->
    <script th:src="@{/js/plugin/bootstrapvalidator/bootstrapValidator.min.js}"></script>

    <link rel="stylesheet" href="https://blueimp.github.io/Gallery/css/blueimp-gallery.min.css"/>
    <!-- CSS to style the file input field as button and adjust the Bootstrap progress bars -->
    <link rel="stylesheet" th:href="@{/js/plugin/jquery-uploadfile/css/jquery.fileupload.css}"/>
    <link rel="stylesheet" th:href="@{/js/plugin/jquery-uploadfile/css/jquery.fileupload-ui.css}"/>

    <script th:src="@{/js/plugin/jquery-media/jquery.medea.js}"></script>
    <!-- The jQuery UI widget factory, can be omitted if jQuery UI is already included -->
    <script th:src="@{/js/plugin/jquery-uploadfile/js/vendor/jquery.ui.widget.js}"></script>
    <!-- The Load Image plugin is included for the preview images and image resizing functionality -->
    <script src="https://blueimp.github.io/JavaScript-Load-Image/js/load-image.all.min.js"></script>
    <!--    &lt;!&ndash; The Canvas to Blob plugin is included for image resizing functionality &ndash;&gt;-->
    <!--    <script src="https://blueimp.github.io/JavaScript-Canvas-to-Blob/js/canvas-to-blob.min.js"></script>-->
    <!-- blueimp Gallery script -->
    <!--    <script src="https://blueimp.github.io/Gallery/js/jquery.blueimp-gallery.min.js"></script>-->
    <!-- The Iframe Transport is required for browsers without support for XHR file uploads -->
    <script th:src="@{/js/plugin/jquery-uploadfile/js/jquery.iframe-transport.js}"></script>
    <!-- The basic File Upload plugin -->
    <script th:src="@{/js/plugin/jquery-uploadfile/js/jquery.fileupload.js}"></script>
    <!-- The File Upload processing plugin -->
    <script th:src="@{/js/plugin/jquery-uploadfile/js/jquery.fileupload-process.js}"></script>
    <!-- The File Upload image preview & resize plugin -->
    <script th:src="@{/js/plugin/jquery-uploadfile/js/jquery.fileupload-image.js}"></script>
    <!-- The File Upload audio preview plugin -->
    <script th:src="@{/js/plugin/jquery-uploadfile/js/jquery.fileupload-audio.js}"></script>
    <!-- The File Upload video preview plugin -->
    <script th:src="@{/js/plugin/jquery-uploadfile/js/jquery.fileupload-video.js}"></script>
    <!-- The File Upload validation plugin -->
    <!--    <script th:src="@{/js/plugin/jquery-uploadfile/js/jquery.fileupload-validate.js}"></script>-->
    <!-- The File Upload user interface plugin -->
    <script th:src="@{/js/plugin/jquery-uploadfile/js/jquery.fileupload-ui.js}"></script>
    <script th:src="@{/js/plugin/jquery-uploadfile/js/config.js}"></script>
    <script th:src="@{/js/plugin/ckeditor5/build/ckeditor.js}"></script>
    <script th:src="@{/js/pages/course.js}"></script>
    <script th:inline="javascript">

        $(document).ready(function () {
            //초기화
            pageInit();

            //저장
            $("#btnSave").click(function (event) {
                event.preventDefault();
                //등록
                courseRegAndMod($("#courseFrom"));
            });

            //메인이미지 키
            $("#fileMainImg").change(setmainImg);

        });

        var setmainImg = function () {


            var inputFiles = this.files;
            if (inputFiles == undefined || inputFiles.length == 0) return;
            var inputFile = inputFiles[0];
            if(inputFile.name != "" ){
                var ext = inputFile.name.split('.').pop().toLowerCase();
                if($.inArray(ext, ['gif','png','jpg','jpeg']) == -1) {
                    alert('gif,png,jpg,jpeg 파일만 업로드 할수 있습니다.');
                    $(this).val("");;
                    return;
                }
            }

            var reader = new FileReader();
            reader.onload = function (event) {
                $("#mainImg").val(event.target.result);
                $("#viewMinImg").attr("src", event.target.result).css({ width: 200, height: 100});
            };

            reader.onerror = function (event) {
                alert("ERROR: " + event.target.error.code);
            };
            reader.readAsDataURL(inputFile);
        }
    </script>

</th:block>

</html>
